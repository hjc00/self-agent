<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      border-radius: 8px;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
    }
    @keyframes menuOpen {
      from { transform-origin: top center; transform: scaleY(0); }
      to   { transform-origin: top center; transform: scaleY(1); }
    }
    @keyframes menuClose {
      from { transform-origin: top center; transform: scaleY(1); }
      to   { transform-origin: top center; transform: scaleY(0); }
    }
    @keyframes dropdownIn {
      from { opacity: 0; transform: scale(0.95); }
      to   { opacity: 1; transform: scale(1); }
    }
    .menu-wrapper {
      background: #2d2d2d;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      padding-bottom: 4px;
      transform: scaleY(0);
    }
    .menu-wrapper.open {
      animation: menuOpen 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    .menu-wrapper.closing {
      animation: menuClose 0.18s ease-in forwards;
    }
    .header {
      padding: 10px 12px;
      background: #1a1a1a;
      font-size: 12px; color: #888;
      border-bottom: 1px solid #3d3d3d;
    }
    .project-list { max-height: 300px; overflow-y: auto; }
    .project-item {
      padding: 8px 10px; cursor: default;
      display: flex; align-items: center; gap: 8px;
      font-size: 13px;
      transition: background 0.15s;
      position: relative;
    }
    .project-item:hover { background: #3d3d3d; }
    .project-item .icon { color: #f5a623; flex-shrink: 0; }
    .project-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .project-actions {
      display: flex;
      gap: 2px;
      opacity: 0;
      transition: opacity 0.15s;
      flex-shrink: 0;
    }
    .project-item:hover .project-actions { opacity: 1; }
    .action-btn {
      width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      color: #888;
      background: transparent;
      border: none;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
    }
    .action-btn:hover { background: #555; }
    .action-btn.default-mode { color: #7ee787; }
    .action-btn.default-mode:hover { color: #a8f5b4; }
    .action-btn.bypass-mode { color: #fca5a5; }
    .action-btn.bypass-mode:hover { color: #fecaca; }

    /* Dropdown */
    .dropdown {
      position: absolute;
      right: 4px;
      top: calc(100% + 2px);
      width: 180px;
      background: #2d2d2d;
      border: 1px solid #3a3a3a;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      z-index: 100;
      display: none;
      animation: dropdownIn 0.12s ease-out;
      overflow: hidden;
    }
    .dropdown.show { display: block; }
    .dropdown.drop-up {
      top: auto;
      bottom: calc(100% + 2px);
    }
    .dropdown-item {
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #ccc;
      cursor: pointer;
      transition: background 0.12s;
      white-space: nowrap;
    }
    .dropdown-item:hover { background: #3d3d3d; color: #fff; }
    .dropdown-item .dd-icon { width: 16px; text-align: center; flex-shrink: 0; }
    .dropdown-item.remove { color: #e81123; }
    .dropdown-item.remove:hover { background: #3d3d3d; }
    .dropdown-divider {
      height: 1px;
      background: #3a3a3a;
      margin: 2px 0;
    }

    .divider {
      height: 1px; background: #3d3d3d;
      margin: 4px 0;
    }
    .settings-item {
      padding: 10px 12px; cursor: pointer;
      display: flex; align-items: center; gap: 8px;
      font-size: 13px;
      transition: background 0.15s;
    }
    .settings-item:hover { background: #3d3d3d; }
    .settings-item .icon { color: #888; }
    .quit-item {
      padding: 10px 12px; cursor: pointer;
      display: flex; align-items: center; gap: 8px;
      font-size: 13px;
      transition: background 0.15s;
      color: #e81123;
    }
    .quit-item:hover { background: #3d3d3d; }
    .quit-item .icon { color: #e81123; }
    .empty {
      padding: 20px 12px; text-align: center;
      color: #666; font-size: 12px;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }
  </style>
</head>
<body>
  <div class="menu-wrapper" id="menuWrapper">
    <div class="header">项目列表</div>
    <div class="project-list" id="projectList">
      <div class="empty">加载中...</div>
    </div>
    <div class="divider"></div>
    <div class="settings-item" id="addProjectBtn">
      <span class="icon">＋</span>
      <span>添加项目</span>
    </div>
    <div class="settings-item" id="settingsBtn">
      <span class="icon">⚙</span>
      <span>设置</span>
    </div>
    <div class="divider"></div>
    <div class="quit-item" id="quitBtn">
      <span class="icon">✕</span>
      <span>退出</span>
    </div>
  </div>
  <script>
    var api = window.electronAPI;
    var wrapper = document.getElementById('menuWrapper');
    var openDropdown = null;

    api.onMenuShow(function() {
      requestAnimationFrame(function() {
        wrapper.classList.add('open');
      });
    });

    api.onMenuCloseRequest(function() {
      if (wrapper.classList.contains('closing')) return;
      wrapper.classList.remove('open');
      wrapper.classList.add('closing');

      var done = false;
      function finish() {
        if (done) return;
        done = true;
        api.notifyMenuAnimationDone();
      }

      wrapper.addEventListener('animationend', function handler(e) {
        if (e.animationName === 'menuClose') {
          wrapper.removeEventListener('animationend', handler);
          finish();
        }
      });

      setTimeout(finish, 350);
    });

    function closeAllDropdowns() {
      if (openDropdown) {
        openDropdown.classList.remove('show');
        openDropdown = null;
      }
    }

    document.addEventListener('click', function(e) {
      if (openDropdown && !e.target.closest('.dropdown') && !e.target.closest('.more-btn')) {
        closeAllDropdowns();
      }
    });

    function buildDropdown(project, itemEl, isNearBottom) {
      var dropdown = document.createElement('div');
      dropdown.className = 'dropdown' + (isNearBottom ? ' drop-up' : '');
      dropdown.innerHTML =
        '<div class="dropdown-item" data-action="toggle-hooks">' +
          '<span class="dd-icon">🪝</span>' +
          '<span>' + (project.disableHooks ? '启用 Git Hook' : '禁用 Git Hook') + '</span>' +
        '</div>' +
        '<div class="dropdown-item" data-action="open-explorer">' +
          '<span class="dd-icon">📂</span>' +
          '<span>在资源管理器中打开</span>' +
        '</div>' +
        '<div class="dropdown-divider"></div>' +
        '<div class="dropdown-item remove" data-action="remove">' +
          '<span class="dd-icon">🗑</span>' +
          '<span>从列表中移除</span>' +
        '</div>';

      dropdown.querySelector('[data-action="toggle-hooks"]').addEventListener('click', async function(e) {
        e.stopPropagation();
        var result = await api.toggleGitHooks(project.path);
        if (result.success) {
          project.disableHooks = result.disableHooks;
          this.querySelector('span:last-child').textContent = result.disableHooks ? '启用 Git Hook' : '禁用 Git Hook';
        }
        api.log('toggle-git-hooks: ' + JSON.stringify(result));
      });

      dropdown.querySelector('[data-action="open-explorer"]').addEventListener('click', function(e) {
        e.stopPropagation();
        api.openInExplorer(project.path);
      });

      dropdown.querySelector('[data-action="remove"]').addEventListener('click', async function(e) {
        e.stopPropagation();
        await api.removeProject(project.path);
        closeAllDropdowns();
        loadProjects();
      });

      return dropdown;
    }

    async function loadProjects() {
      var list = document.getElementById('projectList');
      var projects = [];
      try {
        projects = await api.getProjects();
      } catch (e) {
        projects = [];
      }
      list.innerHTML = '';

      if (!projects || projects.length === 0) {
        list.innerHTML = '<div class="empty">暂无项目，请编辑 projects.json</div>';
        requestAnimationFrame(function() {
          api.resizeMenu(document.body.scrollHeight);
        });
        return;
      }

      var total = projects.length;
      projects.forEach(function(project, index) {
        var projectPath = project.path || project;
        var item = document.createElement('div');
        item.className = 'project-item';
        var name = projectPath.replace(/\\/g, '/').split('/').pop() || projectPath;
        item.innerHTML =
          '<span class="icon">📁</span>' +
          '<span class="project-name" title="' + projectPath + '">' + name + '</span>' +
          '<div class="project-actions">' +
            '<button class="action-btn default-mode" title="默认模式启动">▶</button>' +
            '<button class="action-btn bypass-mode" title="跳过权限启动">⚡</button>' +
            '<button class="action-btn more-btn" title="更多">⋮</button>' +
          '</div>';

        // Dropdown
        var isNearBottom = index >= total - 2 && total > 3;
        var dropdown = buildDropdown(project, item, isNearBottom);
        item.appendChild(dropdown);

        item.querySelector('.default-mode').addEventListener('click', function(e) {
          e.stopPropagation();
          api.launchProject(projectPath, 'autoEdit');
          api.hideMenu();
        });
        item.querySelector('.bypass-mode').addEventListener('click', function(e) {
          e.stopPropagation();
          api.launchProject(projectPath, 'bypassPermission');
          api.hideMenu();
        });
        item.querySelector('.more-btn').addEventListener('click', function(e) {
          e.stopPropagation();
          if (openDropdown === dropdown) {
            dropdown.classList.remove('show');
            openDropdown = null;
          } else {
            closeAllDropdowns();
            dropdown.classList.add('show');
            openDropdown = dropdown;
          }
        });

        list.appendChild(item);
      });

      requestAnimationFrame(function() {
        api.resizeMenu(document.body.scrollHeight);
      });
    }

    document.getElementById('addProjectBtn').addEventListener('click', async function() {
      const result = await api.addProject();
      if (result.success) {
        loadProjects();
      } else if (result.reason === 'duplicate') {
        api.log('项目已存在: ' + result.path);
      }
    });

    document.getElementById('settingsBtn').addEventListener('click', function() {
      api.hideMenu();
      api.openSettings();
    });

    document.getElementById('quitBtn').addEventListener('click', function() {
      api.quitApp();
    });

    loadProjects().then(function() {
      requestAnimationFrame(function() {
        var h = document.body.scrollHeight;
        api.resizeMenu(h);
      });
    });
  </script>
</body>
</html>
